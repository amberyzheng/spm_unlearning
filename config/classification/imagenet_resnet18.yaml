model:
  target: models.spm_classifier.SemiParametricClassifier
  params:
    encoder_type: resnet18
    embed_dim: None
    num_classes: 1000
    learning_rate: 0.1
    pretrained_imagenet: true
    pretrained_cifar: false

data:
  target: dataset.imagenet_datamodule.ImageNetDataModule
  params:
    data_dir: ./data/imagenet  # Path to ImageNet dataset (ILSVRC/Data/CLS-LOC)
    batch_size: 256
    model_type: classifier
    num_classes: 1000
    support_size_train: 1024
    support_size_eval: 3072
    query_digits: null
    support_digits: null
    normalize: true

lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      project: Spm
      name: imagenet_resnet_run
  callbacks:
    lr_monitor:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
    checkpoint_callback:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        monitor: val_acc
        mode: max
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:02d}-{val_acc:.2f}"
        dirpath: "./results/classification/imagenet_resnet18"
    gpu_memory:
      target: utils.logging.GPUMemoryCallback
  trainer:
    max_epochs: 160
    devices: 8
    check_val_every_n_epoch: 1
    log_every_n_steps: 1
    accelerator: "gpu"
    strategy: "ddp_find_unused_parameters_true"